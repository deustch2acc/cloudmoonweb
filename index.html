<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudmoon Fork</title>
    <style>
        /* Sleek Neon Dark Theme */
        :root {
            --bg-color: #0a0a0c;
            --container-bg: #141417;
            --neon-blue: #00f2fe;
            --neon-purple: #4f00ff;
            --text-color: #e0e0e0;
            --border-neon: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Prevents double scrollbars */
        }

        /* Persistent Top Bar */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: rgba(20, 20, 23, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid var(--neon-purple);
            box-shadow: 0 0 15px rgba(79, 0, 255, 0.3);
            z-index: 1000;
        }

        /* Classroom Button Style */
        .classroom-btn {
            background: transparent;
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: var(--border-neon);
        }

        .classroom-btn:hover {
            background-color: var(--neon-blue);
            color: var(--bg-color);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.8);
        }

        /* Main File Container */
        .main-container {
            margin-top: 70px; /* Space for persistent button */
            width: 100vw;
            height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SVG Viewport (Big, center of page) */
        iframe {
            width: 95%;
            height: 95%;
            border: 1px solid #333;
            background-color: white; /* SVG background */
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <!-- Persistent Top Bar with Button -->
    <div class="header">
        <a href="https://classroom.google.com" target="_self" class="classroom-btn">
            Google Classroom
        </a>
    </div>

    <!-- Contained Space for SVG -->
    <div class="main-container">
        <iframe src="260420.svg" frameborder="0"></iframe>
    </div>

</body>
</html>
